<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Timing Vault</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --text-color: #f8fafc;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }

    .game-container {
      background-color: var(--panel-bg);
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 90%;
      max-width: 360px;
    }

    h1 { margin: 0 0 10px 0; font-size: 1.5rem; color: #94a3b8; }

    .score-board {
      display: flex; justify-content: space-around;
      margin-bottom: 15px; font-size: 1.1rem; font-weight: bold;
    }
    .score-board span { color: var(--accent-green); }

    .timer-container {
      width: 250px; height: 8px; background: #334155;
      margin: 0 auto 15px auto; border-radius: 4px; overflow: hidden;
    }
    #timer-bar {
      width: 100%; height: 100%; background: var(--accent-green);
      transition: width 0.1s linear;
    }

    .vault-wrapper {
      position: relative; width: 250px; height: 250px;
      margin: 0 auto 15px auto; cursor: pointer;
      touch-action: none; /* 터치 스크롤/줌 방지 */
    }

    canvas { width: 100%; height: 100%; border-radius: 50%; }

    .btn {
      background-color: var(--accent-green); color: #000; border: none;
      padding: 12px 24px; font-size: 1rem; font-weight: bold;
      border-radius: 8px; cursor: pointer; width: 100%;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <h1>TIMING VAULT</h1>
    <div class="score-board">
      <div>SCORE: <span id="score">0</span></div>
      <div>BEST: <span id="high-score">0</span></div>
    </div>
    <div class="timer-container"><div id="timer-bar"></div></div>
    <div class="vault-wrapper" id="vault-click-area">
      <canvas id="vaultCanvas" width="300" height="300"></canvas>
    </div>
    <button class="btn" id="start-btn">GAME START</button>
  </div>

  <script>
    const canvas = document.getElementById('vaultCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const timerBar = document.getElementById('timer-bar');
    const startBtn = document.getElementById('start-btn');
    const vaultClickArea = document.getElementById('vault-click-area');

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = 120;

    let isPlaying = false;
    let score = 0;
    let highScore = localStorage.getItem('vault_high_score') || 0;
    
    let needleAngle = 0;
    let speed = 0.03;
    let direction = 1;
    
    const baseTargetSize = Math.PI / 3;
    let targetStart = 0;
    let targetSize = baseTargetSize;

    const MAX_TIME = 10;
    let timeRemaining = MAX_TIME;
    let lastTime = 0;
    let animFrameId = null;

    highScoreEl.innerText = highScore;

    function generateTarget() {
      targetStart = Math.random() * Math.PI * 2;
      // 5단계마다 타겟 크기 5%씩 축소
      const reductionFactor = Math.pow(0.95, Math.floor(score / 5));
      targetSize = Math.max(Math.PI / 20, baseTargetSize * reductionFactor);
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // 다이얼
      ctx.beginPath(); ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.fillStyle = '#334155'; ctx.fill();
      ctx.lineWidth = 8; ctx.strokeStyle = '#475569'; ctx.stroke();

      // 타겟
      ctx.beginPath(); ctx.arc(centerX, centerY, radius - 4, targetStart, targetStart + targetSize);
      ctx.lineWidth = 12; ctx.strokeStyle = '#22c55e'; ctx.stroke();

      // 바늘
      const needleX = centerX + Math.cos(needleAngle) * (radius - 15);
      const needleY = centerY + Math.sin(needleAngle) * (radius - 15);
      ctx.beginPath(); ctx.moveTo(centerX, centerY); ctx.lineTo(needleX, needleY);
      ctx.lineWidth = 5; ctx.strokeStyle = '#ef4444'; ctx.lineCap = 'round'; ctx.stroke();
    }

    function update(timestamp) {
      if (!isPlaying) return;

      if (!lastTime) lastTime = timestamp;
      const deltaTime = (timestamp - lastTime) / 1000;
      lastTime = timestamp;
      timeRemaining -= deltaTime;
      
      timerBar.style.width = Math.max(0, (timeRemaining / MAX_TIME) * 100) + "%";
      
      if (timeRemaining <= 0) {
        gameOver();
        return;
      }

      needleAngle = (needleAngle + speed * direction + Math.PI * 2) % (Math.PI * 2);
      draw();
      animFrameId = requestAnimationFrame(update);
    }

    function startGame() {
      score = 0; speed = 0.03; direction = 1; needleAngle = 0;
      timeRemaining = MAX_TIME; lastTime = 0;
      scoreEl.innerText = score;
      startBtn.style.display = 'none';
      isPlaying = true;
      generateTarget();
      animFrameId = requestAnimationFrame(update);
    }

    function gameOver() {
      isPlaying = false;
      startBtn.style.display = 'block';
      startBtn.innerText = 'GAME OVER! RESTART';
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('vault_high_score', highScore);
        highScoreEl.innerText = highScore;
      }
    }

    // 터치/클릭 로직 통합
    function handleAction(e) {
      if (e) e.preventDefault();
      if (!isPlaying) return;
      
      // 입력 즉시 잠금 (중복 클릭 방지)
      isPlaying = false; 

      let current = needleAngle;
      let start = (targetStart + Math.PI * 2) % (Math.PI * 2);
      let end = (start + targetSize) % (Math.PI * 2);
      let isSuccess = (start < end) ? (current >= start && current <= end) : (current >= start || current <= end);

      if (isSuccess) {
        score++;
        scoreEl.innerText = score;
        speed += 0.003;
        direction *= -1;
        timeRemaining = MAX_TIME;
        generateTarget();
        isPlaying = true; // 성공 시에만 다시 활성화
      } else {
        gameOver();
      }
    }

    vaultClickArea.addEventListener('pointerdown', handleAction);

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (!isPlaying && startBtn.style.display !== 'none') startGame();
        else if (isPlaying) handleAction();
      }
    });

    generateTarget();
    draw();
  </script>
</body>
</html>
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Timing Vault</title>
  <style>
    :root { --bg-color: #0f172a; --panel-bg: #1e293b; --accent-green: #22c55e; --accent-red: #ef4444; --text-color: #f8fafc; }
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color); font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; touch-action: manipulation; }
    .game-container { background-color: var(--panel-bg); padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); text-align: center; width: 90%; max-width: 360px; }
    .timer-container { width: 250px; height: 8px; background: #334155; margin: 0 auto 15px auto; border-radius: 4px; overflow: hidden; }
    #timer-bar { width: 100%; height: 100%; background: var(--accent-green); transition: width 0.1s linear; }
    .vault-wrapper { position: relative; width: 250px; height: 250px; margin: 0 auto 15px auto; touch-action: none; }
    canvas { width: 100%; height: 100%; border-radius: 50%; }
    .btn { background-color: var(--accent-green); color: #000; border: none; padding: 12px 24px; font-weight: bold; border-radius: 8px; width: 100%; cursor: pointer; }
  </style>
</head>
<body>
  <div class="game-container">
    <h1>TIMING VAULT</h1>
    <div class="timer-container"><div id="timer-bar"></div></div>
    <div class="vault-wrapper" id="vault-click-area"><canvas id="vaultCanvas" width="300" height="300"></canvas></div>
    <button class="btn" id="start-btn">GAME START</button>
  </div>

  <script>
    const canvas = document.getElementById('vaultCanvas');
    const ctx = canvas.getContext('2d');
    const timerBar = document.getElementById('timer-bar');
    const startBtn = document.getElementById('start-btn');
    const vaultClickArea = document.getElementById('vault-click-area');

    let isPlaying = false;
    let score = 0, needleAngle = 0, speed = 2.0; // 속도 단위를 조정 (초당 회전)
    let direction = 1, targetStart = 0, targetSize = Math.PI / 3;
    let timeRemaining = 10, lastTime = 0, animFrameId = null;

    function generateTarget() {
      targetStart = Math.random() * Math.PI * 2;
      const reduction = Math.pow(0.95, Math.floor(score / 5));
      targetSize = Math.max(Math.PI / 20, (Math.PI / 3) * reduction);
    }

    function draw() {
      ctx.clearRect(0, 0, 300, 300);
      ctx.beginPath(); ctx.arc(150, 150, 120, 0, Math.PI * 2);
      ctx.fillStyle = '#334155'; ctx.fill();
      ctx.beginPath(); ctx.arc(150, 150, 116, targetStart, targetStart + targetSize);
      ctx.lineWidth = 8; ctx.strokeStyle = '#22c55e'; ctx.stroke();
      const needleX = 150 + Math.cos(needleAngle) * 100;
      const needleY = 150 + Math.sin(needleAngle) * 100;
      ctx.beginPath(); ctx.moveTo(150, 150); ctx.lineTo(needleX, needleY);
      ctx.lineWidth = 5; ctx.strokeStyle = '#ef4444'; ctx.stroke();
    }

    function update(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const deltaTime = (timestamp - lastTime) / 1000;
      lastTime = timestamp;

      if (isPlaying) {
        timeRemaining -= deltaTime;
        // 핵심: deltaTime을 곱하여 프레임 드랍과 무관하게 속도 고정
        needleAngle += (speed * direction) * deltaTime * 2; 
        needleAngle %= (Math.PI * 2);
        timerBar.style.width = Math.max(0, (timeRemaining / 10) * 100) + "%";
        if (timeRemaining <= 0) gameOver();
      }
      draw();
      animFrameId = requestAnimationFrame(update);
    }

    function startGame() {
      score = 0; speed = 2.0; isPlaying = true; 
      timeRemaining = 10; startBtn.style.display = 'none';
      generateTarget();
      animFrameId = requestAnimationFrame(update);
    }

    function gameOver() {
      isPlaying = false;
      startBtn.style.display = 'block';
      startBtn.innerText = 'RETRY';
    }

    function handleAction(e) {
      if (e) e.preventDefault();
      if (!isPlaying) return;
      
      let current = needleAngle;
      let end = (targetStart + targetSize) % (Math.PI * 2);
      let isSuccess = (targetStart < end) ? (current >= targetStart && current <= end) : (current >= targetStart || current <= end);

      if (isSuccess) {
        score++;
        speed += 0.2; // 속도 증가폭 조정
        direction *= -1;
        timeRemaining = 10;
        generateTarget();
      } else {
        gameOver();
      }
    }

    vaultClickArea.addEventListener('pointerdown', handleAction);
    startBtn.addEventListener('click', startGame);
    window.addEventListener('keydown', (e) => { if(e.code === 'Space') { if(!isPlaying && startBtn.style.display !== 'none') startGame(); else handleAction(); }});
    
    animFrameId = requestAnimationFrame(update);
  </script>
</body>
</html>
