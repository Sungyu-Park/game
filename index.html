<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Timing Vault</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --dial-color: #334155;
      --text-color: #f8fafc;
    }

    * {
      box-sizing: border-box;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .game-container {
      background-color: var(--panel-bg);
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      text-align: center;
      width: 360px;
    }

    h1 {
      margin: 0 0 10px 0;
      font-size: 1.5rem;
      letter-spacing: 2px;
      color: #94a3b8;
    }

    .score-board {
      display: flex;
      justify-content: space-around;
      margin-bottom: 20px;
      font-size: 1.1rem;
      font-weight: bold;
    }

    .score-board span {
      color: var(--accent-green);
    }

    .vault-wrapper {
      position: relative;
      width: 250px;
      height: 250px;
      margin: 0 auto 20px auto;
      cursor: pointer;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .instructions {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 15px;
    }

    .btn {
      background-color: var(--accent-green);
      color: #000;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s;
    }

    .btn:hover {
      transform: scale(1.05);
      background-color: #4ade80;
    }

    .btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <div class="game-container">
    <h1>TIMING VAULT</h1>
    
    <div class="score-board">
      <div>SCORE: <span id="score">0</span></div>
      <div>BEST: <span id="high-score">0</span></div>
    </div>

    <div class="vault-wrapper" id="vault-click-area">
      <canvas id="vaultCanvas" width="300" height="300"></canvas>
    </div>

    <div class="instructions">화면을 클릭하거나 스페이스바를 누르세요</div>
    <button class="btn" id="start-btn">GAME START</button>
  </div>

  <script>
    const canvas = document.getElementById('vaultCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const startBtn = document.getElementById('start-btn');
    const vaultClickArea = document.getElementById('vault-click-area');

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = 120;

    // 게임 상태 변수
    let isPlaying = false;
    let score = 0;
    let highScore = localStorage.getItem('vault_high_score') || 0;
    
    let needleAngle = 0;
    let speed = 0.03; // 회전 속도
    let direction = 1; // 1: 시계방향, -1: 반시계방향
    
    let targetStart = 0;
    let targetSize = Math.PI / 3; // 기본 타겟 크기 (60도)

    highScoreEl.innerText = highScore;

    // 새로운 타겟 영역 생성
    function generateTarget() {
      // 바늘 위치와 너무 가깝지 않은 곳에 타겟 배치
      let minDistance = Math.PI / 2;
      let newTarget = Math.random() * Math.PI * 2;
      
      while (Math.abs(newTarget - needleAngle) < minDistance) {
        newTarget = Math.random() * Math.PI * 2;
      }
      
      targetStart = newTarget;
      // 점수가 높을수록 타겟 크기를 줄임 (최소 12도까지)
      targetSize = Math.max(Math.PI / 15, (Math.PI / 3) - (score * 0.015));
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. 금고 다이얼 바탕
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.fillStyle = '#334155';
      ctx.fill();
      ctx.lineWidth = 8;
      ctx.strokeStyle = '#475569';
      ctx.stroke();

      // 2. 정답(타겟) 영역
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius - 4, targetStart, targetStart + targetSize);
      ctx.lineWidth = 12;
      ctx.strokeStyle = '#22c55e';
      ctx.stroke();

      // 3. 회전 바늘
      const needleX = centerX + Math.cos(needleAngle) * (radius - 15);
      const needleY = centerY + Math.sin(needleAngle) * (radius - 15);

      ctx.beginPath();
      ctx.moveTo(centerX, centerY);
      ctx.lineTo(needleX, needleY);
      ctx.lineWidth = 5;
      ctx.strokeStyle = '#ef4444';
      ctx.lineCap = 'round';
      ctx.stroke();

      // 4. 중앙 노브
      ctx.beginPath();
      ctx.arc(centerX, centerY, 15, 0, Math.PI * 2);
      ctx.fillStyle = '#f8fafc';
      ctx.fill();
    }

    function update() {
      if (!isPlaying) return;

      needleAngle += speed * direction;
      // 각도를 0 ~ 2PI 범위로 유지
      needleAngle = (needleAngle + Math.PI * 2) % (Math.PI * 2);

      draw();
      requestAnimationFrame(update);
    }

    function startGame() {
      score = 0;
      speed = 0.03;
      direction = 1;
      needleAngle = 0;
      scoreEl.innerText = score;
      isPlaying = true;
      startBtn.innerText = 'UNLOCKING...';
      generateTarget();
      update();
    }

    function gameOver() {
      isPlaying = false;
      startBtn.innerText = 'TRY AGAIN';
      
      if (score > highScore) {
        highScore = score;
        localStorage.setItem('vault_high_score', highScore);
        highScoreEl.innerText = highScore;
      }
      
      // 실패 시 빨간색 깜빡임 효과
      ctx.beginPath();
      ctx.arc(centerX, centerY, radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(239, 68, 68, 0.4)';
      ctx.fill();
    }

    function handleAction() {
      if (!isPlaying) return;

      // 각도 판정 규격화 (0 ~ 2PI)
      let current = needleAngle;
      let start = (targetStart + Math.PI * 2) % (Math.PI * 2);
      let end = (start + targetSize) % (Math.PI * 2);

      let isSuccess = false;

      if (start < end) {
        isSuccess = current >= start && current <= end;
      } else {
        // 타겟이 0(360도) 지점에 걸쳐 있는 경우
        isSuccess = current >= start || current <= end;
      }

      if (isSuccess) {
        score++;
        scoreEl.innerText = score;
        
        // 난이도 상승: 속도 증가 & 회전 방향 전환
        speed += 0.003;
        direction *= -1; 
        
        generateTarget();
      } else {
        gameOver();
      }
    }

    // 이벤트 리스너
    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      startGame();
    });

    vaultClickArea.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (isPlaying) {
        handleAction();
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (!isPlaying && startBtn.innerText !== 'UNLOCKING...') {
          startGame();
        } else {
          handleAction();
        }
      }
    });

    // 초기 화면 그리기
    generateTarget();
    draw();
  </script>
</body>
</html>
