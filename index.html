<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Timing Vault - Robust</title>
  <style>
    :root { --bg-color: #0f172a; --panel-bg: #1e293b; --accent-green: #22c55e; --accent-red: #ef4444; --text-color: #f8fafc; }
    * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; touch-action: none; }
    body { margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color); font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
    .game-container { background-color: var(--panel-bg); padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5); text-align: center; width: 90%; max-width: 360px; position: relative; }
    .timer-container { width: 250px; height: 8px; background: #334155; margin: 0 auto 15px auto; border-radius: 4px; overflow: hidden; }
    #timer-bar { width: 100%; height: 100%; background: var(--accent-green); transition: width 0.05s linear; }
    .vault-wrapper { position: relative; width: 250px; height: 250px; margin: 0 auto 15px auto; }
    canvas { width: 100%; height: 100%; border-radius: 50%; }
    
    /* 버튼 클릭 이슈 해결: z-index 추가 및 절대 위치 조정 */
    #start-btn { 
        background-color: var(--accent-green); color: #000; border: none; 
        padding: 15px 30px; font-weight: bold; border-radius: 8px; width: 100%; 
        cursor: pointer; font-size: 1.1rem; position: relative; z-index: 10;
    }
  </style>
</head>
<body>

  <div class="game-container">
    <h1>TIMING VAULT</h1>
    <div class="timer-container"><div id="timer-bar"></div></div>
    <div class="vault-wrapper" id="vault-click-area"><canvas id="vaultCanvas" width="300" height="300"></canvas></div>
    <button id="start-btn">GAME START</button>
  </div>

  <script>
    const canvas = document.getElementById('vaultCanvas');
    const ctx = canvas.getContext('2d');
    const timerBar = document.getElementById('timer-bar');
    const startBtn = document.getElementById('start-btn');
    const vaultClickArea = document.getElementById('vault-click-area');

    let isPlaying = false;
    let score = 0, needleAngle = 0, speed = 2.0;
    let direction = 1, targetStart = 0, targetSize = Math.PI / 3;
    let timeRemaining = 10, lastTime = 0, lastInputTime = 0;

    function generateTarget() {
      targetStart = Math.random() * Math.PI * 2;
      const reduction = Math.pow(0.95, Math.floor(score / 5));
      targetSize = Math.max(Math.PI / 20, (Math.PI / 3) * reduction);
    }

    function draw() {
      ctx.clearRect(0, 0, 300, 300);
      ctx.beginPath(); ctx.arc(150, 150, 120, 0, Math.PI * 2);
      ctx.fillStyle = '#334155'; ctx.fill();
      ctx.beginPath(); ctx.arc(150, 150, 116, targetStart, targetStart + targetSize);
      ctx.lineWidth = 8; ctx.strokeStyle = '#22c55e'; ctx.stroke();
      const needleX = 150 + Math.cos(needleAngle) * 100;
      const needleY = 150 + Math.sin(needleAngle) * 100;
      ctx.beginPath(); ctx.moveTo(150, 150); ctx.lineTo(needleX, needleY);
      ctx.lineWidth = 5; ctx.strokeStyle = '#ef4444'; ctx.stroke();
    }

    function update(timestamp) {
      if (!lastTime) lastTime = timestamp;
      // [중요] 렉 방지: 한 프레임이 너무 길어질 경우(최대 0.1초로 제한) 보정
      const deltaTime = Math.min((timestamp - lastTime) / 1000, 0.1); 
      lastTime = timestamp;

      if (isPlaying) {
        timeRemaining -= deltaTime;
        needleAngle += (speed * direction) * deltaTime * 2;
        needleAngle %= (Math.PI * 2);
        timerBar.style.width = Math.max(0, (timeRemaining / 10) * 100) + "%";
        if (timeRemaining <= 0) gameOver();
      }
      draw();
      requestAnimationFrame(update);
    }

    function startGame(e) {
      if(e) { e.preventDefault(); e.stopPropagation(); }
      score = 0; speed = 2.0; isPlaying = true;
      timeRemaining = 10; startBtn.style.display = 'none';
      generateTarget();
      lastTime = performance.now(); // 초기 시간 보정
      requestAnimationFrame(update);
    }

    function gameOver() {
      isPlaying = false;
      startBtn.style.display = 'block';
      startBtn.innerText = 'RETRY';
    }

    function handleAction(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      const now = Date.now();
      if (now - lastInputTime < 300) return; // 디바운싱 강화 (300ms)
      lastInputTime = now;

      if (!isPlaying) return;
      
      let current = needleAngle;
      let end = (targetStart + targetSize) % (Math.PI * 2);
      let isSuccess = (targetStart < end) ? (current >= targetStart && current <= end) : (current >= targetStart || current <= end);

      if (isSuccess) {
        score++;
        speed += 0.2;
        direction *= -1;
        timeRemaining = 10;
        generateTarget();
      } else {
        gameOver();
      }
    }

    // [이벤트 분리]
    vaultClickArea.addEventListener('pointerdown', handleAction);
    startBtn.addEventListener('pointerdown', startGame);
    
    window.addEventListener('keydown', (e) => { 
        if(e.code === 'Space') { 
            if(!isPlaying && startBtn.style.display !== 'none') startGame(); 
            else handleAction(); 
        }
    });
    
    requestAnimationFrame(update);
  </script>
</body>
</html>
