<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta 
    name="viewport" 
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>Timing Vault</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --panel-bg: #1e293b;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --text-color: #f8fafc;
      --sub-text: #94a3b8;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-color);
      color: var(--text-color);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    .game-container {
      background-color: var(--panel-bg);
      padding: 2rem;
      border-radius: 24px;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.4);
      text-align: center;
      width: 90%;
      max-width: 380px;
      position: relative;
    }

    .header-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
      font-size: 0.95rem;
      color: var(--sub-text);
      font-weight: 600;
    }

    .score-badge {
      font-size: 1.4rem;
      color: var(--accent-green);
      font-weight: bold;
    }

    h1 {
      margin: 0 0 1rem 0;
      font-size: 1.5rem;
      letter-spacing: 2px;
    }

    .timer-container {
      width: 260px;
      height: 8px;
      background: #334155;
      margin: 0 auto 15px auto;
      border-radius: 4px;
      overflow: hidden;
    }

    #timer-bar {
      width: 100%;
      height: 100%;
      background: var(--accent-green);
      transition: width 0.05s linear;
    }

    .vault-wrapper {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 0 auto 1.5rem auto;
      cursor: pointer;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .btn {
      background-color: var(--accent-green);
      color: #0f172a;
      border: none;
      padding: 16px 32px;
      font-weight: 800;
      border-radius: 12px;
      width: 100%;
      cursor: pointer;
      font-size: 1.1rem;
      z-index: 10;
      position: relative;
    }

    .guide-text {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: var(--sub-text);
    }
  </style>
</head>
<body>

  <div class="game-container">
    <div class="header-info">
      <div>BEST: <span id="high-score">0</span></div>
      <div>SCORE: <span id="current-score" class="score-badge">0</span></div>
    </div>

    <h1>TIMING VAULT</h1>

    <div class="timer-container">
      <div id="timer-bar"></div>
    </div>

    <div class="vault-wrapper" id="vault-area">
      <canvas id="vaultCanvas" width="300" height="300"></canvas>
    </div>

    <button class="btn" id="start-btn">GAME START</button>

    <div class="guide-text" id="guide-text">
      터치 또는 스페이스바를 눌러 잠금을 해제하세요
    </div>
  </div>

  <script>
    // --- DOM 요소 정의 ---
    const canvas = document.getElementById('vaultCanvas');
    const ctx = canvas.getContext('2d');
    const timerBar = document.getElementById('timer-bar');
    const startBtn = document.getElementById('start-btn');
    const vaultArea = document.getElementById('vault-area');
    const currentScoreEl = document.getElementById('current-score');
    const highScoreEl = document.getElementById('high-score');
    const guideTextEl = document.getElementById('guide-text');

    // --- 게임 변수 ---
    let isPlaying = false;
    let score = 0;
    let highScore = localStorage.getItem('timing_vault_highscore') || 0;

    let needleAngle = 0;
    let speed = 1;
    let direction = 1;

    let targetStart = 0;
    let targetSize = Math.PI / 3;

    let timeRemaining = 10;
    let lastTime = 0;
    let lastInputTime = 0;

    // --- 초기화 ---
    highScoreEl.innerText = highScore;

    // --- 타겟 생성 함수 ---
    function generateTarget() {
      targetStart = Math.random() * Math.PI * 2;
      const reduction = Math.pow(0.95, Math.floor(score / 5));
      targetSize = Math.max(Math.PI / 18, (Math.PI / 3) * reduction);
    }

    // --- 화면 그리기 ---
    function draw() {
      ctx.clearRect(0, 0, 300, 300);

      // 다이얼 테두리
      ctx.beginPath();
      ctx.arc(150, 150, 130, 0, Math.PI * 2);
      ctx.fillStyle = '#1e293b';
      ctx.fill();

      // 다이얼 배경
      ctx.beginPath();
      ctx.arc(150, 150, 120, 0, Math.PI * 2);
      ctx.fillStyle = '#334155';
      ctx.fill();

      // 타겟 (초록 영역)
      ctx.beginPath();
      ctx.arc(150, 150, 116, targetStart, targetStart + targetSize);
      ctx.lineWidth = 10;
      ctx.strokeStyle = '#22c55e';
      ctx.stroke();

      // 회전 바늘
      const needleX = 150 + Math.cos(needleAngle) * 100;
      const needleY = 150 + Math.sin(needleAngle) * 100;

      ctx.beginPath();
      ctx.moveTo(150, 150);
      ctx.lineTo(needleX, needleY);
      ctx.lineWidth = 5;
      ctx.strokeStyle = '#ef4444';
      ctx.lineCap = 'round';
      ctx.stroke();

      // 중앙 캡
      ctx.beginPath();
      ctx.arc(150, 150, 12, 0, Math.PI * 2);
      ctx.fillStyle = '#f8fafc';
      ctx.fill();
    }

    // --- 프레임 업데이트 ---
    function update(timestamp) {
      if (!lastTime) {
        lastTime = timestamp;
      }

      const deltaTime = Math.min((timestamp - lastTime) / 1000, 0.1);
      lastTime = timestamp;

      if (isPlaying) {
        timeRemaining -= deltaTime;

        needleAngle += (speed * direction) * deltaTime * 2;
        needleAngle = (needleAngle % (Math.PI * 2) + (Math.PI * 2)) % (Math.PI * 2);

        const progress = Math.max(0, (timeRemaining / 10) * 100);
        timerBar.style.width = progress + "%";

        if (progress < 30) {
          timerBar.style.backgroundColor = '#ef4444';
        } else {
          timerBar.style.backgroundColor = '#22c55e';
        }

        if (timeRemaining <= 0) {
          gameOver();
        }
      }

      draw();
      requestAnimationFrame(update);
    }

    // --- 게임 시작 ---
    function startGame(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      score = 0;
      speed = 1;
      isPlaying = true;
      timeRemaining = 10;

      startBtn.style.display = 'none';
      guideTextEl.style.display = 'none';

      currentScoreEl.innerText = score;
      generateTarget();

      lastTime = performance.now();
      requestAnimationFrame(update);
    }

    // --- 게임 종료 ---
    function gameOver() {
      isPlaying = false;

      if (score > highScore) {
        highScore = score;
        localStorage.setItem('timing_vault_highscore', highScore);
        highScoreEl.innerText = highScore;
      }

      startBtn.style.display = 'block';
      startBtn.innerText = 'RETRY';
      guideTextEl.style.display = 'block';
    }

    // --- 입력 판정 ---
    function handleAction(e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }

      const now = Date.now();
      if (now - lastInputTime < 250) {
        return;
      }
      lastInputTime = now;

      if (!isPlaying) {
        return;
      }

      let current = needleAngle;
      let targetEnd = (targetStart + targetSize) % (Math.PI * 2);

      let isSuccess = false;
      if (targetStart < targetEnd) {
        isSuccess = current >= targetStart && current <= targetEnd;
      } else {
        isSuccess = current >= targetStart || current <= targetEnd;
      }

      if (isSuccess) {
        score++;
        currentScoreEl.innerText = score;
        speed += 0.1;
        direction *= -1;
        timeRemaining = 10;
        generateTarget();
      } else {
        gameOver();
      }
    }

    // --- 이벤트 리스너 ---
    vaultArea.addEventListener('pointerdown', handleAction);
    startBtn.addEventListener('pointerdown', startGame);

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        if (!isPlaying && startBtn.style.display !== 'none') {
          startGame();
        } else {
          handleAction();
        }
      }
    });

    requestAnimationFrame(update);
  </script>
</body>
</html>
